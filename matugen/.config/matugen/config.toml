[config.wallpaper]
set = true
pre_hook = "pkill -x swaybg || true"
command = "sh -lc \"exec swaybg -m fill -i '{{image}}' >/dev/null 2>&1 &\""

[templates.waybar]
input_path  = "~/.config/matugen/templates/waybar.css"
output_path = "~/.cache/matugen/waybar.css"
post_hook   = "pkill -SIGUSR2 waybar || true"

[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.cache/matugen/rofi.rasi"

[templates.sway]
input_path  = "~/.config/matugen/templates/sway-colors.conf"
output_path = "~/.cache/matugen/sway-colors.conf"
post_hook   = "swaymsg reload >/dev/null"

[templates.alacritty]
input_path  = "~/.config/matugen/templates/alacritty-colors.toml"
output_path = "~/.cache/matugen/alacritty-colors.toml"

[templates.tmux]
input_path  = "~/.config/matugen/templates/tmux.conf"
output_path = "~/.cache/matugen/tmux.conf"
post_hook   = "sh -lc 'tmux source-file ~/.cache/matugen/tmux.conf \\; refresh-client -S >/dev/null 2>&1 || true'"

[templates.swayosd]
input_path  = "~/.config/matugen/templates/swayosd.css"
output_path = "~/.cache/matugen/swayosd.css"
# swayosd reads its CSS only at startup
post_hook   = "sh -c 'pkill -x swayosd-server; setsid --fork swayosd-server >/dev/null 2>&1 </dev/null'"

[templates.swaylock]
input_path  = "~/.config/matugen/templates/swaylock.conf"
output_path = "~/.config/swaylock/config"

[templates.swaync]
input_path  = "~/.config/matugen/templates/swaync.css"
output_path = "~/.config/swaync/style.css"
post_hook   = "swaync-client -rs >/dev/null 2>&1 || true"
